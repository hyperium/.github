name: PR Template Verification

on:
  workflow_call:
    inputs:
      comment-on-open:
        description: Post a comment if the template check fails when the PR opens
        type: boolean
        default: false

permissions: {}

jobs:
  verify-template:
    if: github.event.pull_request.author_association != 'MEMBER'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR template was preserved
        id: check-template
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const canary = "- [x] The description, docs, and comments (words meant for humans) are written by a human, not by an LLM.";

            if (!body.includes(canary)) {
              core.setFailed(
                "PR description is missing the template's human-authorship statement. Please restore it."
              );
            }

      - name: Comment on missing PR template statement
        if: >-
          ${{
            failure() &&
            steps.check-template.outcome == 'failure' &&
            inputs.comment-on-open &&
            github.event.action == 'opened' &&
            github.run_attempt == '1'
          }}
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: |-
            Hey there! It looks like this description was written by an LLM. Is that right?

            We ask that [communication be written by humans](https://hyper.rs/contrib/ai-policy/).

            If I'm wrong, sorry about that, I'm a bot. :robot:
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.COMMENT_BODY,
            });
